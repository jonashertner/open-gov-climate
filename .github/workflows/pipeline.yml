name: pipeline

# Kept separate from deploy.yml so a Python failure can never block the site
# deploy, and a site change never re-runs the engine's checks.
on:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: pipeline

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python and dependencies
        run: |
          uv python install 3.14
          uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q
