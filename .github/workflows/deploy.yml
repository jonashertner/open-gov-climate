name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  # Riverflow refreshes its federal datasets early on Monday. Rebuild the host
  # afterwards so /riverflow follows the verified publication automatically.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Open Gov Climate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Riverflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jonashertner/riverflow-ch
          ref: main
          path: .riverflow
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Build Open Gov Climate
        run: |
          npm ci
          npm run build
      - name: Verify and add Riverflow
        run: |
          npm --prefix .riverflow ci
          npm --prefix .riverflow test
          PUBLICATION_REVISION="$(git -C .riverflow rev-parse HEAD)" node .riverflow/build/16-provenance.mjs
          node .riverflow/scripts/verify-site.mjs
          mkdir -p dist/riverflow
          cp -R .riverflow/site/. dist/riverflow/
          test -f dist/riverflow/index.html
          test -f dist/riverflow/data/provenance.json
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the complete site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
